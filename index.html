<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Messenger AI</title>

<style>
:root{
  --primary:#1877f2;
  --primary2:#0d6efd;
  --bg:#f0f2f5;
  --card:#fff;
  --text:#111827;
  --muted:#65676b;
  --border:#dddfe2;
  --msg:#e4e6eb;
  --mine:#1877f2;
  --danger:#e53935;
  --success:#31a24c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#auth{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#1877f2,#6c5ce7);
}

.auth-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 60px #0003;
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:bold;
  color:var(--primary);
  margin-bottom:8px;
}

.auth-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:14px 15px;
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:12px;
  outline:none;
}

.input:focus{
  border-color:var(--primary);
}

.btn{
  width:100%;
  padding:14px;
  border-radius:10px;
  background:var(--primary);
  color:white;
  font-weight:bold;
  margin-top:5px;
}

.btn.secondary{
  background:#e4e6eb;
  color:#111;
}

.auth-switch{
  text-align:center;
  margin-top:20px;
  color:var(--primary);
  cursor:pointer;
}

/* APP */

#app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  z-index:10;
}

.brand{
  font-size:23px;
  font-weight:bold;
  color:var(--primary);
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#e4e6eb;
  font-size:20px;
}

.layout{
  flex:1;
  display:flex;
  min-height:0;
}

/* SIDEBAR */

.sidebar{
  width:350px;
  background:white;
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.sidebar-header{
  padding:18px;
}

.sidebar-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.sidebar-title h2{
  font-size:25px;
}

.search{
  width:100%;
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  padding:12px 16px;
  outline:none;
}

.user-list{
  overflow-y:auto;
  flex:1;
}

.user-item{
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.user-item:hover{
  background:#f0f2f5;
}

.user-item.active{
  background:#e7f3ff;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.user-info{
  min-width:0;
  flex:1;
}

.user-name{
  font-weight:bold;
}

.last-msg{
  color:var(--muted);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.online{
  width:11px;
  height:11px;
  background:var(--success);
  border-radius:50%;
  border:2px solid white;
  margin-right:-16px;
  margin-top:34px;
  z-index:2;
}

/* CHAT */

.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-empty{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  text-align:center;
}

.chat-header{
  height:70px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 18px;
}

.chat-user-info{
  flex:1;
}

.chat-name{
  font-weight:bold;
  font-size:17px;
}

.chat-status{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.message-row{
  display:flex;
}

.message-row.mine{
  justify-content:flex-start;
}

.message-row.theirs{
  justify-content:flex-end;
}

.message{
  max-width:min(70%,600px);
  padding:10px 14px;
  border-radius:18px;
  position:relative;
  word-break:break-word;
}

.mine .message{
  background:var(--mine);
  color:white;
  border-bottom-left-radius:5px;
}

.theirs .message{
  background:var(--msg);
  color:var(--text);
  border-bottom-right-radius:5px;
}

.msg-time{
  font-size:10px;
  opacity:.7;
  margin-top:4px;
}

.msg-reactions{
  display:flex;
  gap:3px;
  position:absolute;
  bottom:-10px;
  background:white;
  border-radius:20px;
  padding:2px 5px;
  box-shadow:0 1px 5px #0002;
  color:#111;
}

.mine .msg-reactions{
  left:8px;
}

.theirs .msg-reactions{
  right:8px;
}

.typing{
  height:25px;
  padding:0 20px;
  color:var(--muted);
  font-size:13px;
}

.composer{
  background:white;
  border-top:1px solid var(--border);
  padding:10px;
  display:flex;
  align-items:center;
  gap:7px;
}

.composer textarea{
  flex:1;
  resize:none;
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  padding:11px 15px;
  max-height:100px;
  outline:none;
}

.send-btn{
  width:43px;
  height:43px;
  border-radius:50%;
  background:var(--primary);
  color:white;
  font-size:18px;
}

.file-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#e4e6eb;
}

/* PROFILE */

.profile-panel{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:360px;
  background:white;
  z-index:100;
  box-shadow:5px 0 30px #0002;
  padding:25px;
  overflow:auto;
}

.profile-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.profile-big-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:10px auto 15px;
}

.profile-center{
  text-align:center;
}

.profile-center h2{
  margin-bottom:5px;
}

.profile-center p{
  color:var(--muted);
}

.settings-row{
  padding:15px 0;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* AI */

.ai-panel{
  position:fixed;
  bottom:20px;
  left:20px;
  width:360px;
  height:500px;
  background:white;
  border-radius:18px;
  box-shadow:0 10px 50px #0004;
  z-index:200;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.ai-head{
  background:linear-gradient(135deg,#1877f2,#8e44ad);
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.ai-messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.ai-msg{
  padding:10px 12px;
  border-radius:15px;
  margin-bottom:8px;
  max-width:85%;
}

.ai-user{
  background:#1877f2;
  color:white;
  margin-right:auto;
}

.ai-bot{
  background:#e4e6eb;
  margin-left:auto;
}

.ai-input{
  padding:10px;
  border-top:1px solid var(--border);
  display:flex;
  gap:5px;
}

.ai-input input{
  flex:1;
  padding:10px;
  border:1px solid var(--border);
  border-radius:18px;
  outline:none;
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    width:100%;
  }

  .chat{
    display:none;
  }

  .layout.chat-open .sidebar{
    display:none;
  }

  .layout.chat-open .chat{
    display:flex;
  }

  .back-mobile{
    display:block!important;
  }

  .message{
    max-width:82%;
  }

  .ai-panel{
    left:10px;
    right:10px;
    width:auto;
    bottom:10px;
  }
}

@media(min-width:801px){
  .back-mobile{
    display:none!important;
  }
}
</style>
</head>

<body>

<!-- AUTH -->
<section id="auth">

    <div class="logo">Messenger AI</div>
    <div class="auth-sub">تواصل مع الآخرين بطريقة أسرع وأذكى</div>

    <div id="loginForm">

<!-- APP -->
<section id="app" class="hidden">

    </div>

<!-- Firebase -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updateProfile as firebaseUpdateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   ضع بيانات Firebase الخاصة بك هنا
===================================================== */

const firebaseConfig = {

  apiKey:
    "ضع_API_KEY_هنا",

  authDomain:
    "ضع_PROJECT_ID.firebaseapp.com",

  projectId:
    "ضع_PROJECT_ID_هنا",

  storageBucket:
    "ضع_PROJECT_ID.firebasestorage.app",

  messagingSenderId:
    "ضع_SENDER_ID_هنا",

  appId:
    "ضع_APP_ID_هنا"

};


/* Firebase */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let selectedUser = null;

let messagesUnsubscribe = null;

let usersUnsubscribe = null;

let typingTimer = null;

let isRecording = false;

let mediaRecorder = null;

let audioChunks = [];

let currentLang = "ar";


/* =====================================================
   ELEMENTS
===================================================== */

const authScreen =
  document.getElementById("auth");

const appScreen =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const registerForm =
  document.getElementById("registerForm");

const layout =
  document.getElementById("layout");

const userList =
  document.getElementById("userList");

const messagesBox =
  document.getElementById("messages");


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(auth, async user => {

  if(user){

    currentUser = user;

    authScreen.classList.add("hidden");

    appScreen.classList.remove("hidden");

    await createUserDocument();

    loadUsers();

    setOnline(true);

    loadMyProfile();

  }else{

    currentUser = null;

    authScreen.classList.remove("hidden");

    appScreen.classList.add("hidden");

  }

});


/* =====================================================
   AUTH UI
===================================================== */

window.showRegister = function(){

  loginForm.classList.add("hidden");

  registerForm.classList.remove("hidden");

};


window.showLogin = function(){

  registerForm.classList.add("hidden");

  loginForm.classList.remove("hidden");

};


/* =====================================================
   REGISTER
===================================================== */

window.register = async function(){

  const name =
    document.getElementById("regName").value.trim();

  const email =
    document.getElementById("regEmail").value.trim();

  const password =
    document.getElementById("regPassword").value;

  if(!name || !email || !password){

    alert("أكمل جميع البيانات");

    return;

  }

  if(password.length < 6){

    alert("كلمة المرور يجب أن تكون 6 أحرف على الأقل");

    return;

  }

  try{

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await firebaseUpdateProfile(
      result.user,
      {
        displayName:name
      }
    );

    await setDoc(
      doc(db,"users",result.user.uid),
      {
        uid:result.user.uid,
        name:name,
        email:email,
        photo:"",
        online:true,
        lastSeen:serverTimestamp(),
        createdAt:serverTimestamp()
      }
    );

  }catch(error){

    alert(firebaseError(error));

  }

};


/* =====================================================
   LOGIN
===================================================== */

window.login = async function(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    alert("أدخل البريد وكلمة المرور");

    return;

  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    alert(firebaseError(error));

  }

};


/* =====================================================
   LOGOUT
===================================================== */

window.logout = async function(){

  if(currentUser){

    await setOnline(false);

  }

  await signOut(auth);

};


/* =====================================================
   CREATE USER
===================================================== */

async function createUserDocument(){

  if(!currentUser)return;

  const ref =
    doc(db,"users",currentUser.uid);

  const snap =
    await getDoc(ref);

  if(!snap.exists()){

    await setDoc(ref,{
      uid:currentUser.uid,
      name:currentUser.displayName || "مستخدم",
      email:currentUser.email || "",
      photo:"",
      online:true,
      lastSeen:serverTimestamp(),
      createdAt:serverTimestamp()
    });

  }

}


/* =====================================================
   USERS
===================================================== */

function loadUsers(){

  if(usersUnsubscribe)
    usersUnsubscribe();

  usersUnsubscribe =
    onSnapshot(
      collection(db,"users"),
      snapshot => {

        const search =
          document
          .getElementById("userSearch")
          .value
          .trim()
          .toLowerCase();

        const users = [];

        snapshot.forEach(item => {

          const user = item.data();

          if(user.uid === currentUser.uid)
            return;

          if(search){

            const text =
              `${user.name || ""} ${user.email || ""}`
              .toLowerCase();

            if(!text.includes(search))
              return;

          }

          users.push(user);

        });

        users.sort((a,b) =>
          (a.name || "").localeCompare(
            b.name || "",
            "ar"
          )
        );

        renderUsers(users);

      }
    );

}


window.searchUsers = function(){

  loadUsers();

};


function renderUsers(users){

  userList.innerHTML = "";

  if(!users.length){

    userList.innerHTML = `
      <div style="padding:30px;text-align:center;color:#777">
        لا يوجد مستخدمون
      </div>
    `;

    return;

  }

  users.forEach(user => {

    const item =
      document.createElement("div");

    item.className =
      "user-item";

    if(selectedUser &&
       selectedUser.uid === user.uid){

      item.classList.add("active");

    }

    item.innerHTML = `

      <img
        class="avatar"
        src="${escapeAttr(
          user.photo ||
          "https://i.pravatar.cc/100?u="+user.uid
        )}">

      ${user.online ? `<span class="online"></span>` : ""}

      <div class="user-info">

        <div class="user-name">
          ${escapeHTML(user.name || "مستخدم")}
        </div>

        <div class="last-msg">
          ${user.online ? "🟢 متصل الآن" : "آخر ظهور"}
        </div>

      </div>

    `;

    item.onclick =
      () => openChat(user);

    userList.appendChild(item);

  });

}


/* =====================================================
   OPEN CHAT
===================================================== */

window.openChat = function(user){

  selectedUser = user;

  layout.classList.add("chat-open");

  document
    .getElementById("chatEmpty")
    .classList.add("hidden");

  document
    .getElementById("chatContent")
    .classList.remove("hidden");

  document
    .getElementById("chatName")
    .textContent =
      user.name || "مستخدم";

  document
    .getElementById("chatAvatar")
    .src =
      user.photo ||
      "https://i.pravatar.cc/100?u="+user.uid;

  updateChatStatus();

  loadMessages();

};


/* =====================================================
   CHAT STATUS
===================================================== */

function updateChatStatus(){

  if(!selectedUser)return;

  document
    .getElementById("chatStatus")
    .textContent =
      selectedUser.online
      ? "🟢 متصل الآن"
      : "غير متصل";

}


/* =====================================================
   CONVERSATION ID
===================================================== */

function conversationId(){

  if(!selectedUser || !currentUser)
    return "";

  return [
    currentUser.uid,
    selectedUser.uid
  ].sort().join("_");

}


/* =====================================================
   MESSAGES
===================================================== */

function loadMessages(){

  if(messagesUnsubscribe)
    messagesUnsubscribe();

  messagesBox.innerHTML = "";

  const conversation =
    conversationId();

  const messagesRef =
    collection(
      db,
      "conversations",
      conversation,
      "messages"
    );

  const q =
    query(
      messagesRef,
      orderBy("createdAt","asc")
    );

  messagesUnsubscribe =
    onSnapshot(q,snapshot => {

      messagesBox.innerHTML = "";

      snapshot.forEach(item => {

        renderMessage(
          item.id,
          item.data()
        );

      });

      messagesBox.scrollTop =
        messagesBox.scrollHeight;

    });

}


/* =====================================================
   SEND MESSAGE
===================================================== */

window.sendMessage = async function(){

  if(!selectedUser)return;

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text)return;

  const conversation =
    conversationId();

  await addDoc(
    collection(
      db,
      "conversations",
      conversation,
      "messages"
    ),
    {
      senderId:currentUser.uid,
      receiverId:selectedUser.uid,
      text:text,
      type:"text",
      createdAt:serverTimestamp(),
      read:false,
      reactions:{}
    }
  );

  input.value = "";

  await updateDoc(
    doc(db,"conversations",conversation),
    {
      lastMessage:text,
      lastMessageAt:serverTimestamp()
    }
  ).catch(async ()=>{

    await setDoc(
      doc(db,"conversations",conversation),
      {
        users:[
          currentUser.uid,
          selectedUser.uid
        ],
        lastMessage:text,
        lastMessageAt:serverTimestamp()
      }
    );

  });

  stopTyping();

};


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(id,message){

  const mine =
    message.senderId === currentUser.uid;

  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (mine ? "mine" : "theirs");

  const bubble =
    document.createElement("div");

  bubble.className =
    "message";

  let content = "";

  if(message.type === "text"){

    content =
      escapeHTML(message.text || "");

  }else if(message.type === "image"){

    content = `
      <img
        src="${escapeAttr(message.url)}"
        style="max-width:260px;border-radius:12px">
    `;

  }else if(message.type === "file"){

    content = `
      <a
        href="${escapeAttr(message.url)}"
        target="_blank"
        style="color:inherit">
        📎 ${escapeHTML(message.name || "ملف")}
      </a>
    `;

  }else if(message.type === "audio"){

    content = `
      <audio controls src="${escapeAttr(message.url)}"></audio>
    `;

  }

  bubble.innerHTML = `
    <div>${content}</div>

    <div class="msg-time">
      ${message.createdAt
        ? formatTime(message.createdAt)
        : "..."}
      ${mine
        ? (message.read ? " ✔✔" : " ✔")
        : ""}
    </div>

    <div style="margin-top:5px">
      <button
        onclick="reactMessage('${id}','❤️')"
        style="background:none;color:inherit">
        ❤️
      </button>

      <button
        onclick="deleteMessage('${id}')"
        style="background:none;color:inherit">
        🗑️
      </button>
    </div>
  `;

  row.appendChild(bubble);

  messagesBox.appendChild(row);

}

window.deleteMessage =

/* =====================================================
   AUDIO
===================================================== */

window.toggleRecording =
  async function(){

    if(isRecording){

      mediaRecorder.stop();

      isRecording = false;

      return;

    }

    try{

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });

      audioChunks = [];

      mediaRecorder =
        new MediaRecorder(stream);

      mediaRecorder.ondataavailable =
        e => audioChunks.push(e.data);

      mediaRecorder.onstop =
        async () => {

          stream
            .getTracks()
            .forEach(track => track.stop());

          alert(
            "تم تسجيل الصوت. اربط Firebase Storage لإرساله."
          );

        };

      mediaRecorder.start();

      isRecording = true;

    }catch(error){

      alert(
        "لم يتم السماح باستخدام الميكروفون."
      );

    }

  };

/* =====================================================
   HELPERS
===================================================== */

function formatTime(timestamp){

  try{

    return timestamp
      .toDate()
      .toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }catch{

    return "";

  }

}


function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(text){

  return String(text)
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function firebaseError(error){

  const code =
    error.code || "";

  const errors = {

    "auth/email-already-in-use":
      "هذا البريد مستخدم بالفعل.",

    "auth/invalid-email":
      "البريد الإلكتروني غير صحيح.",

    "auth/weak-password":
      "كلمة المرور ضعيفة.",

    "auth/invalid-credential":
      "البريد أو كلمة المرور غير صحيحة.",

    "auth/network-request-failed":
      "تحقق من اتصال الإنترنت."

  };

  return errors[code] ||
    "حدث خطأ: " + code;

}
