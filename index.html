<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق المحادثة - وضع عدم الاتصال</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        #messagesBox { max-width: 600px; height: 400px; background: #fff; margin: auto; overflow-y: auto; padding: 15px; border: 1px solid #ddd; border-radius: 8px; display: flex; flex-direction: column; }
        .message-row { margin-bottom: 10px; display: flex; }
        .message-row.mine { justify-content: flex-end; }
        .message { background: #e3f2fd; padding: 10px; border-radius: 8px; max-width: 70%; word-break: break-word; }
        .message-row.mine .message { background: #dcf8c6; }
        .msg-time { font-size: 10px; color: #777; margin-top: 4px; text-align: left; }
        .chat-input-area { max-width: 600px; margin: 10px auto; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .chat-input-area button { padding: 10px 20px; background: #0084ff; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="messagesBox"></div>
    
    <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا...">
        <button onclick="window.sendMessage()">إرسال</button>
    </div>

    <!-- استدعاء مكتبات Firebase (CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
          apiKey: "...",
          authDomain: "...",
          projectId: "...",
          storageBucket: "...",
          messagingSenderId: "...",
          appId: "..."
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ربط المتغيرات بنطاق عام (Window) ليستخدمها نظام الأوفلاين لاحقاً
        window.db = db;
        window.auth = auth;
        window.addDoc = addDoc;
        window.collection = collection;
        window.serverTimestamp = serverTimestamp;

        // متغيرات افتراضية للمستخدم والمحادثة (يجب ربطها بنظام تسجيل الدخول لديك)
        window.currentUser = null;
        window.selectedUser = null;

        // دالة الإرسال الأصلية الافتراضية (يمكنك استبدالها بدالتك الحقيقية لاحقاً)
        window.originalSendMessage = async function() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text || !window.currentUser || !window.selectedUser) return;

            const conversation = [window.currentUser.uid, window.selectedUser.uid].sort().join("_");
            
            await addDoc(collection(window.db, "conversations", conversation, "messages"), {
                senderId: window.currentUser.uid,
                receiverId: window.selectedUser.uid,
                text: text,
                type: "text",
                createdAt: window.serverTimestamp(),
                read: false,
                reactions: {}
            });

            input.value = "";
        };

        // دالة فحص الهروب من HTML للحماية
        window.escapeHTML = function(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        };

        // تهيئة نظام الأوفلاين بعد تحميل Firebase بنجاح
        if (typeof Network !== "undefined") {
            Network.init();
        }
    </script>

    <!-- سكربت نظام الأوفلاين والـ LocalStorage -->
    <script>
        const messagesBox = document.getElementById("messagesBox");

        /* =========================================
           OFFLINE / ONLINE SYSTEM
        ========================================= */
        const Network = {
            online: navigator.onLine,
            init() {
                this.updateStatus();
                window.addEventListener("online", async () => {
                    this.online = true;
                    this.updateStatus();
                    if (typeof syncOfflineMessages === "function") {
                        await syncOfflineMessages();
                    }
                });
                window.addEventListener("offline", () => {
                    this.online = false;
                    this.updateStatus();
                });
            },
            updateStatus() {
                let bar = document.getElementById("networkStatus");
                if (!bar) {
                    bar = document.createElement("div");
                    bar.id = "networkStatus";
                    bar.style.cssText = `
                        position:fixed; top:0; left:0; right:0; z-index:9999;
                        padding:6px; text-align:center; font-size:12px; font-weight:bold; transition:.3s;
                    `;
                    document.body.appendChild(bar);
                }
                if (navigator.onLine) {
                    bar.textContent = "🟢 متصل بالإنترنت";
                    bar.style.background = "#31a24c";
                    bar.style.color = "#fff";
                    setTimeout(() => {
                        if (navigator.onLine) {
                            bar.style.transform = "translateY(-100%)";
                        }
                    }, 2500);
                } else {
                    bar.textContent = "🔴 لا يوجد إنترنت — سيتم حفظ الرسائل ومزامنتها لاحقًا";
                    bar.style.background = "#e53935";
                    bar.style.color = "#fff";
                    bar.style.transform = "translateY(0)";
                }
            }
        };

        /* =========================================
           LOCAL STORAGE DATABASE
        ========================================= */
        const OfflineDB = {
            messagesKey: "messenger_offline_messages",
            getMessages() {
                try {
                    return JSON.parse(localStorage.getItem(this.messagesKey) || "[]");
                } catch {
                    return [];
                }
            },
            saveMessages(messages) {
                localStorage.setItem(this.messagesKey, JSON.stringify(messages));
            },
            addMessage(message) {
                const messages = this.getMessages();
                messages.push(message);
                this.saveMessages(messages);
            },
            removeMessage(localId) {
                const messages = this.getMessages().filter(x => x.localId !== localId);
                this.saveMessages(messages);
            }
        };

        /* =========================================
           OFFLINE MESSAGE QUEUE
        ========================================= */
        async function saveOfflineMessage(text) {
            if (!selectedUser || !currentUser) return;

            const localMessage = {
                localId: "local_" + Date.now() + "_" + Math.random().toString(36).slice(2),
                senderId: currentUser.uid,
                receiverId: selectedUser.uid,
                text: text,
                type: "text",
                createdAt: Date.now(),
                synced: false
            };

            OfflineDB.addMessage(localMessage);
            renderOfflineMessage(localMessage);
        }

        /* =========================================
           SHOW OFFLINE MESSAGE
        ========================================= */
        function renderOfflineMessage(message) {
            const row = document.createElement("div");
            row.className = "message-row mine";
            row.dataset.localId = message.localId;

            const bubble = document.createElement("div");
            bubble.className = "message";
            bubble.innerHTML = `
                <div>${escapeHTML(message.text)}</div>
                <div class="msg-time">
                    ${new Date(message.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} ⏳
                </div>
            `;

            row.appendChild(bubble);
            messagesBox.appendChild(row);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        /* =========================================
           SYNC
        ========================================= */
        async function syncOfflineMessages() {
            if (!navigator.onLine || !currentUser || typeof db === 'undefined') return;

            const pending = OfflineDB.getMessages();
            if (!pending.length) return;

            for (const message of pending) {
                try {
                    const conversation = [message.senderId, message.receiverId].sort().join("_");

                    await addDoc(collection(db, "conversations", conversation, "messages"), {
                        senderId: message.senderId,
                        receiverId: message.receiverId,
                        text: message.text,
                        type: message.type,
                        createdAt: serverTimestamp(),
                        read: false,
                        reactions: {}
                    });

                    OfflineDB.removeMessage(message.localId);

                    const element = document.querySelector(`[data-local-id="${message.localId}"]`);
                    if (element) {
                        const time = element.querySelector(".msg-time");
                        if (time) {
                            time.textContent = new Date(message.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " ✔";
                        }
                    }
                } catch (error) {
                    console.log("Offline sync waiting:", error);
                }
            }
        }

        /* =========================================
           OVERRIDE SEND MESSAGE
        ========================================= */
        window.sendMessage = async function() {
            if (!selectedUser) return;

            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text) return;

            if (!navigator.onLine) {
                await saveOfflineMessage(text);
                input.value = "";
                return;
            }

            try {
                if (typeof originalSendMessage === "function") {
                    await originalSendMessage();
                }
            } catch (error) {
                await saveOfflineMessage(text);
                input.value = "";
                console.log("Saved because connection failed", error);
            }
        };

        /* =========================================
           RESTORE LOCAL MESSAGES
        ========================================= */
        function restoreOfflineMessages() {
            if (!currentUser || !selectedUser) return;
            const messages = OfflineDB.getMessages();
            messages
                .filter(message => message.senderId === currentUser.uid && message.receiverId === selectedUser.uid)
                .forEach(renderOfflineMessage);
        }

        /* =========================================
           SERVICE WORKER
        ========================================= */
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", async () => {
                try {
                    await navigator.serviceWorker.register("./sw.js");
                    console.log("Offline system enabled");
                } catch (error) {
                    console.log("Service Worker error:", error);
                }
            });
        }
    </script>
</body>
</html>
